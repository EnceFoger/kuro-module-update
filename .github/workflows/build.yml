name: Build Rena
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hook library
        run: |
          B=https://raw.githubusercontent.com/Rprop/And64InlineHook/master
          curl -fL -o And64InlineHook.hpp $B/And64InlineHook.hpp
          curl -fL -o And64InlineHook.cpp $B/And64InlineHook.cpp
          grep -q A64HookFunction And64InlineHook.hpp
      - name: Fetch official zygisk.hpp
        run: |
          curl -fL -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          grep -q REGISTER_ZYGISK_MODULE zygisk.hpp
      - name: Build
        run: |
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kuro-mod-menu
          path: kuro-mod-menu.zip
          if-no-files-found: error
